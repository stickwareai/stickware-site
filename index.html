<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickware</title>
<link rel="icon" href="stickware.png">
<style>
  :root {
    --bg-0: #08090c;
    --bg-1: #161b22;
    --fg: #f5f5f4;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, var(--bg-1) 0%, var(--bg-0) 75%);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* faint dot grid, fades at edges */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 78%);
            mask-image: radial-gradient(ellipse at center, black 35%, transparent 78%);
    pointer-events: none;
  }
  .stage {
    position: relative;
    display: grid;
    place-items: center;
    animation: rise 1.1s cubic-bezier(.16,.84,.3,1) both;
  }
  /* soft glow behind logo */
  .stage::after {
    content: "";
    position: absolute;
    inset: -10% -6%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.14), transparent 62%);
    filter: blur(28px);
    z-index: -1;
  }
  img.logo {
    display: block;
    width: min(72vw, 62vh);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stage { animation: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="logo" src="stickware-white.png" alt="Stickware">
  </div>
</body>
</html>
