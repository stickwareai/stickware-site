<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickware</title>
<link rel="icon" href="stickware.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500&display=swap">
<style>
  :root {
    --bg-0: #08090c;
    --bg-1: #161b22;
    --fg: #f5f5f4;
    --dim: rgba(245, 245, 244, 0.5);
    --bright: rgba(245, 245, 244, 0.92);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, var(--bg-1) 0%, var(--bg-0) 75%);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* faint dot grid, fades at edges */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 78%);
            mask-image: radial-gradient(ellipse at center, black 35%, transparent 78%);
    pointer-events: none;
  }
  /* ambient light, drifts slowly */
  body::after {
    content: "";
    position: absolute;
    inset: -20%;
    background: radial-gradient(ellipse 55% 45% at 50% 45%, rgba(255,255,255,0.045), transparent 70%);
    pointer-events: none;
  }

  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* logo, cropped to the plate so the slogan can sit close beneath it */
  .mark {
    position: relative;
    width: min(78vw, 640px, 120vh);
    aspect-ratio: 10 / 3;
    overflow: hidden;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: -60% -10%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.15), transparent 62%);
    filter: blur(30px);
    z-index: -1;
  }
  .mark img {
    display: block;
    width: 100%;
    height: auto;
    margin-top: -34%;      /* lifts the 1254px square so the plate fills the frame */
    user-select: none;
    -webkit-user-drag: none;
  }

  /* hairline rule, with a light that runs its length */
  .rule {
    position: relative;
    width: min(46vw, 300px);
    height: 1px;
    margin: clamp(1.4rem, 4vh, 2.6rem) 0 clamp(1rem, 2.6vh, 1.7rem);
    background: linear-gradient(90deg,
      transparent, rgba(255,255,255,0.3) 22%, rgba(255,255,255,0.3) 78%, transparent);
  }
  .rule .spark {
    position: absolute;
    inset: -4px 0;
    background:
      radial-gradient(circle 2px at 0 50%, rgba(255,255,255,0.95), transparent 100%),
      radial-gradient(circle 9px at 0 50%, rgba(255,255,255,0.28), transparent 100%);
    opacity: 0;
    pointer-events: none;
  }

  /* slogan */
  .slogan {
    position: relative;
    max-width: min(88vw, 620px);
    font-family: "Saira", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    font-size: clamp(0.66rem, 1.55vw, 0.9rem);
    line-height: 1.9;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-align: center;
    text-wrap: balance;
  }
  .slogan p {
    margin: 0;
    /* the trailing letter-space would push the line off-centre */
    text-indent: 0.3em;
  }
  .word { color: var(--dim); }
  .word.em {
    color: var(--bright);
    text-shadow: 0 0 18px rgba(255,255,255,0.25);
  }
  /* a highlight that sweeps the line, laid exactly over it */
  .shine {
    position: absolute;
    inset: 0;
    text-indent: 0.3em;
    color: transparent;
    background-image: linear-gradient(100deg,
      transparent 42%, rgba(255,255,255,0.9) 50%, transparent 58%);
    background-size: 250% 100%;
    background-position: -20% 0;
    background-repeat: no-repeat;
    -webkit-background-clip: text;
            background-clip: text;
    pointer-events: none;
  }

  @media (prefers-reduced-motion: no-preference) {
    .mark   { animation: rise 1.1s cubic-bezier(.16,.84,.3,1) both; }
    .mark::after { animation: breathe 9s ease-in-out 1.2s infinite; }
    body::after  { animation: drift 26s ease-in-out infinite; }
    .rule {
      transform: scaleX(0);
      animation: draw .9s cubic-bezier(.16,.84,.3,1) .75s forwards;
    }
    .rule .spark { animation: travel 8s cubic-bezier(.5,0,.5,1) 2s infinite; }
    .word {
      opacity: 0;
      animation: settle .8s cubic-bezier(.16,.84,.3,1) both;
      animation-delay: calc(1.05s + var(--i) * .07s);
    }
    .shine { animation: shine 7.5s ease-in-out 3.2s infinite; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }
  @keyframes breathe {
    0%, 100% { opacity: .8; }
    50%      { opacity: 1; }
  }
  @keyframes drift {
    0%, 100% { transform: translate3d(-1.5%, -1%, 0) scale(1); }
    50%      { transform: translate3d( 1.5%,  1%, 0) scale(1.06); }
  }
  @keyframes draw {
    to { transform: scaleX(1); }
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(8px); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
  }
  @keyframes travel {
    0%        { transform: translateX(0);    opacity: 0; }
    12%, 84%  { opacity: 1; }
    100%      { transform: translateX(100%); opacity: 0; }
  }
  @keyframes shine {
    0%       { background-position: 120% 0; }
    36%, 100%{ background-position: -20% 0; }
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="mark">
      <img src="stickware-white.png" alt="Stickware">
    </div>

    <div class="rule"><span class="spark"></span></div>

    <div class="slogan">
      <p>
        <span class="word" style="--i:0">The</span>
        <span class="word em" style="--i:1">first</span>
        <span class="word em" style="--i:2">mile</span>
        <span class="word" style="--i:3">to</span>
        <span class="word" style="--i:4">your</span>
        <span class="word" style="--i:5">AI</span>
        <span class="word" style="--i:6">journey</span>
      </p>
      <span class="shine" aria-hidden="true">The first mile to your AI journey</span>
    </div>
  </div>
</body>
</html>
