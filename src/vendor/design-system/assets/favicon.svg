<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stickware">
  <!--
    Favicon variant of the Stickware mark. Unlike the header logo (logo-mark.svg),
    which is a transparent brass mark meant to sit on the site's parchment surface,
    the favicon needs its own backing: a solid brass app-icon tile so the mark stays
    legible at 16px on a browser's own (light or dark) tab strip. The stick is drawn
    in parchment, with the brass tile showing through the panel/keyring/connector
    cut-outs — same negative-space reading as the logo, just recoloured.
  -->
  <rect width="64" height="64" rx="14" fill="#a9743a"/>
  <svg x="9" y="20" width="46" height="24.8" viewBox="6 18 52 28">
    <defs>
      <mask id="sw-mark">
        <rect x="6" y="18" width="52" height="28" fill="black"/>
        <!-- show (parchment): keyring tab, body, connector -->
        <rect x="6"  y="25" width="11" height="14" rx="3.5" fill="white"/>
        <rect x="13" y="18" width="33" height="28" rx="6"   fill="white"/>
        <rect x="45" y="23" width="13" height="18" rx="2"   fill="white"/>
        <!-- punch (tile shows through): keyring hole, inner-panel gap, connector slots -->
        <rect x="9"  y="28.5" width="4"  height="7"  rx="2"   fill="black"/>
        <rect x="17" y="22"   width="25" height="20" rx="3"   fill="white"/>
        <rect x="19" y="24"   width="21" height="16" rx="2"   fill="black"/>
        <rect x="48.5" y="27" width="7"  height="3"  rx="1"   fill="black"/>
        <rect x="48.5" y="34" width="7"  height="3"  rx="1"   fill="black"/>
      </mask>
    </defs>
    <rect x="6" y="18" width="52" height="28" fill="#f0dabb" mask="url(#sw-mark)"/>
  </svg>
</svg>
